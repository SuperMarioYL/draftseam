<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：剪映 .draft → bundle.py 解析 → Draft 模型 → writer.py 写回 剪映">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- 静态连线（底层） -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="200" y1="180" x2="260" y2="180" marker-end="url(#ah-d)"/>
    <line x1="410" y1="180" x2="470" y2="180" marker-end="url(#ah-d)"/>
    <line x1="620" y1="180" x2="680" y2="180" marker-end="url(#ah-d)"/>
  </g>

  <!-- 行军虚线数据流（顶层）—— 动画参数逐字与 light 版一致 -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="180" x2="256" y2="180" stroke="#4DA3FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="180" x2="466" y2="180" stroke="#8985FF" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="180" x2="676" y2="180" stroke="#2DC79A" stroke-opacity="0.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 数据包圆点沿连线流动 -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M200,180 L256,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M410,180 L466,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M620,180 L676,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 节点 —— 动画参数逐字与 light 版一致 -->
  <g>
    <rect x="50"  y="140" width="150" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#9EC9FF">剪映 .draft</text>
    <text x="125" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#A1A1A8">bundle 目录</text>

    <rect x="260" y="140" width="150" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="335" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#B9B6FF">bundle.py</text>
    <text x="335" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#A1A1A8">解析 template.tmp</text>

    <rect x="470" y="140" width="150" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="545" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#74E0C0">Draft 模型</text>
    <text x="545" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#A1A1A8">schema.py</text>

    <rect x="680" y="140" width="150" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#9EC9FF">writer.py</text>
    <text x="755" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#A1A1A8">写回 剪映</text>
  </g>

  <!-- agent seam 注解（静态） -->
  <text x="440" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#A1A1A8">agent_api → insert_subtitle · add_voiceover · add_transition</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">字幕 = materials.texts · 转场 = materials.transitions · 特效 split across effects/video_effects</text>
</svg>
